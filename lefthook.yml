pre-commit:
  commands:
    oxfmt:
      glob: "*.{ts,tsx,js,jsx,json,css}"
      run: bunx oxfmt --write {staged_files}
      stage_fixed: true
    oxlint:
      glob: "*.{ts,tsx,js,jsx}"
      run: bunx oxlint --fix {staged_files}
      stage_fixed: true
    typecheck:
      run: bunx tsc --noEmit
